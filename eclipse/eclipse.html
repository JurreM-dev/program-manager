<!DOCTYPE html>
<html>
  <head>
    <title>eclipse workspaces</title>
    <link rel="stylesheet" href="../styles/windowStyle.css">
    <link rel="stylesheet" href="./eclipse.css">
    <script src="../libraries/localforage.min.js"></script>
  </head>
  <body>
  <aside>
    <div class="logoContainer">
      <img class="logo" src="https://uploads.onecompiler.io/44pg2mbej/1785433996971/a4ab6e33-8112-4a91-a579-99fe4b3453bb.jpg" />
    </div>
  </aside>
  <div id="main">
    <div id="mainBtns">
      <button onclick="toggleTerminal()" class="basicBtn">>_</button>
      <button id="runner" class="basicBtn">▶</button>
    </div>

    <div class="editor-container">
      <div class="line-numbers" id="lineNumbers">1</div>
     <div class="code-editor" id="editor" contenteditable="true" spellcheck="false">say("welcome")</div>
    </div>
  </div>

  <div id="terminal">
    <textarea spellcheck="false" id="terminalInput">@stellarOS/root: / $ </textarea>
  </div>

    <!-- WINDOWS -->
    <script src="../styles/window.js"></script>
    <!-- SYNTAX HIGHLIGHTING -->
    <script src="eclHighlight.js"></script>
    <!--- RUNNING -->
    <script type="module" src="runEclipse.js"></script>
    <!-- FILE SYSTEM-->
    <script src="../fileManager.js"></script>
    <!--- TERMINAL -->
    <script src="./eclipseTerminal.js"></script>
  </body>
</html>
