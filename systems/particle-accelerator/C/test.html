<script src="./particle.js"></script>
<script type="module">

  import { ParticleAccelerator } from "./../JS/particle-accelerator.js"

  function print(output) {
    console.log(output);
  }

  const text = `
    SET A 500
    OUT A
    MOV B A
    OUT B
    ADD B A
    OUT B
    HLT
  `

  Module.onRuntimeInitialized = () => {
    const assembler = new ParticleAccelerator(Module, print);

    const states = assembler.assemble(text);

    console.log(states);
  };
</script>
