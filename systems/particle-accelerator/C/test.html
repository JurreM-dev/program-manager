<script src="./particle.js"></script>
<script type="module">
  import { ParticleAccelerator } from "./../JS/particle-accelerator.js";

  function print(output) {
    console.log(output);
  }

  const text = `
      SET A 500
      OUT A
      MOV B A
      OUT B
      ADD B A
      OUT B
      HLT
    `;

let assembler = null;
let particleReady = false;

function buildUp() {
  const particleModuleConfig = {
    onRuntimeInitialized: function() {
      particleReady = true;
      assembler = new ParticleAccelerator(this, print);
    },
  };

  createParticleModule(particleModuleConfig);
}

function assembleTest() {
  if (!particleReady) {
    return null;
  }

  return assembler.assemble(text);
}

window.assembleNow = assembleTest;

buildUp();
</script>
