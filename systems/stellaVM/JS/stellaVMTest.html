<script type="module">
import { StellaVM } from './stellaVM.js'

// array we want to succesfully run in the VM
const instructions = [
    0x01, 0x00, 0, 2, // SET A 2
    // testing if CMP and specific jumps work
    0x01, 0x01, 0, 10, // set B 10
    0x01, 0x02, 0, 10, // set C 10
    0x02, 0x02, // OUT C
    0x02, 0x01, // OUT B
    0x09, 0x02, 0x01, // CMP C B
    0x0B, 0, 24, // JEQ 24
    0x02, 0x00, // OUT A
    0x02, 0x00, // OUT A
    0x00 // HLT
];

function output(value) {
    console.log(value);
}

Module.onRuntimeInitialized = () => {

    const stellaVM = new StellaVM(output, Module);

    stellaVM.run(instructions);
    
}
</script>
<script src="../C/vm.js"></script>
