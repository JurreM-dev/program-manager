<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202938;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 56px 24px;
      background: radial-gradient(ellipse at top, #e5edff 0, #f3f6fb 48%, #f7f8fc 100%);
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .page-heading { margin: 0 0 24px; }

    .eyebrow {
      margin: 0 0 8px;
      color: #536de4;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #172033;
      font-size: clamp(28px, 5vw, 38px);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: #687386;
      font-size: 15px;
      line-height: 1.6;
    }

    .editor-card {
      overflow: hidden;
      border: 1px solid #e1e6ef;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(35, 53, 91, .10), 0 2px 8px rgba(35, 53, 91, .04);
    }

    #text-editor { background: #fff; }
    
    #nameInput {
      border-radius: 20px;
      padding: 4px;
      border: 1px solid #e1e6ef;
      font-size: 20px;
      font-weight: bold;
    }

    .controlBtn {
      border: 1px solid #e1e6ef;
      background-color: white;
      font-size: 20px;
      border-radius: 20px;
      padding: 4px;
    }

    .ql-toolbar.ql-snow {
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid #e8ebf1;
      background: #fbfcfe;
    }

    .ql-snow .ql-stroke { stroke: #596579; }
    .ql-snow .ql-fill { fill: #596579; }
    .ql-snow .ql-picker { color: #596579; }
    .ql-snow .ql-picker-options { border-color: #e1e6ef !important; }
    .ql-snow button:hover .ql-stroke,
    .ql-snow button.ql-active .ql-stroke { stroke: #536de4; }

    .ql-container.ql-snow {
      min-height: 460px;
      border: 0;
      color: #283347;
      font-size: 16px;
    }

    .ql-editor {
      min-height: 460px;
      padding: 30px 34px;
      line-height: 1.75;
    }

    .ql-editor.ql-blank::before {
      left: 34px;
      color: #a0a8b7;
      font-style: normal;
    }

    @media (max-width: 600px) {
      body { padding: 32px 14px; }
      .page-heading { margin-bottom: 18px; }
      .ql-toolbar.ql-snow { padding: 9px 7px; }
      .ql-container.ql-snow, .ql-editor { min-height: 55vh; }
      .ql-editor { padding: 22px 18px; }
      .ql-editor.ql-blank::before { left: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-heading">
      <p class="eyebrow">Your workspace</p>
      <h1>Sky editor</h1>
    </header>
    <input placeholder="file name" id="nameInput">
    <button class="controlBtn" onclick="saveFile()">💾</button>
    <button class="controlBtn" onclick="loadFile()">📤</button>
    <section class="editor-card" aria-label="Rich text editor">
      <div id="text-editor"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
  <script>
    let docs = {}

    const quill = new Quill('#text-editor', {
      theme: 'snow',
      placeholder: 'Start writing here…',
      modules: {
        toolbar: [
          [{ 'font': [] }, { 'size': [] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'color': [] }, { 'background': [] }],
          [{ 'script': 'sub'}, { 'script': 'super' }],
          [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'list': 'check' }],
          [{ 'indent': '-1'}, { 'indent': '+1' }],
          [{ 'direction': 'rtl' }, { 'align': [] }],
          ['blockquote', 'code-block'],
          ['link', 'image'],
          ['clean']
        ]
      }
    });

    function saveFile() {
      let fileName = document.getElementById("nameInput").value;
      if(!fileName) {
        alert("error, make a file name first");
        return
      }
      docs[fileName] = {
        name: fileName,
        content: quill.getContents()
      }
      localforage.setItem("skyDocuments", docs);
    }

    async function loadFile() {
      let name = prompt("what file do you want to load?");
      if(!name) {
        alert("input a valid name");
        return
      }
      let potential = await localforage.getItem("skyDocuments");
      if(!potential) {
        alert("error loading");
        return
      }
      docs = potential;
      if(!docs[name]) {
        alert("file not found");
        return
      }
       quill.setContents(docs[name].content);
       document.getElementById("nameInput").value = docs[name].name;
       alert("succesfully loaded content")
    }
    quill.root.setAttribute('spellcheck', false);
  </script>
</body>
</html>
