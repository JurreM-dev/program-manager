<!DOCTYPE html>
<html>
    <head>
        <title>Timer</title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            h1 {
                margin: 0;
            }
            button {
                border-radius: 5px;
                padding: 2px;
            }
            .pageDiv {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            } 
        </style>
    </head>
    <body>
        <div class="pageDiv" id="timerDiv">
            <h1>timer</h1>
            <p id="display">10:00</p>
            <button onclick="startTimer()" id="startBtn">start</button>
            <button onclick="pauseTimer()">pause</button>
            <button onclick="resetTimer()">reset</button>
            <details>
                <summary>edit time</summary>
                <input id="newTimeIn" type="number">
                <button onclick="confirmTime()">confirm</button>
            </details>
        </div>

        <script>
            const display = document.getElementById("display")
            const startBtn = document.getElementById("startBtn");

            let startMinutes = 10;
            let totalTimeSeconds = calcSeconds();
            let timeLeft = totalTimeSeconds;

            let endTime = null;
            let timerInterval = null;

            function calcSeconds() {
                return startMinutes * 60;
            }

            function formatTime(totalSeconds) {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;

                return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
            }

            function updateDisplay() {
                display.innerText = formatTime(timeLeft);
            }

            function tick() {
                const now = Date.now();
                timeLeft = Math.max(0, Math.round((endTime - now) / 1000));

                updateDisplay();

                if(timeLeft === 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("timer is up!")
                }
            }

            function startTimer() {
                if(timerInterval) {
                    return;
                }

                endTime = Date.now() + (timeLeft * 1000);
                timerInterval = setInterval(tick, 500);
                tick();
            }
            function pauseTimer() {
                if(!timerInterval) {
                    return;
                }
                clearInterval(timerInterval);
                timerInterval = null;
            }
            function resetTimer() {
                pauseTimer();
                timeLeft = totalTimeSeconds;
                updateDisplay();
            }
            function confirmTime() {
                let newTime = document.getElementById("newTimeIn").value;
                if(newTime) {
                    newTime = Number(newTime);
                    resetTimer();
                    startMinutes = newTime;
                    totalTimeSeconds = calcSeconds();
                    resetTimer();
                }
            }
        </script>
    </body>
</html>
