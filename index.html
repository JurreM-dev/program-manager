<!doctype html>
<html>
  <head>
    <title>head terminal</title>
    <script src="libraries/localforage.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: black;
        overflow: hidden;
      }
      textarea {
        caret-shape: block;
        background-color: black;
        color: lime;
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        border: none;
        outline: none;
        resize: none;
        font-family: monospace;
        font-size: 18px;
        padding: 15px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <textarea spellcheck="false" id="terminal">@stellarOS/root: / $ </textarea>

    <script src="fileManager.js"></script>
    <script src="mainOs.js"></script>
    <script src="stellarOS/terminal.js"></script>
  </body>
</html>
