<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="editorStyle.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./../../libraries/localforage.min.js"></script>
  </head>
  <body>
    <div id="editor" class="pagePart"></div>
    <div id="output" class="pagePart centerDown">
      <iframe id="outputFrame" class="pageChild"></iframe>
      <div id="errorLogs" class="pageChild"></div>
    </div>

    <!-- BUTTONS -->
     <div class="floatBtnBar">
      <button class="floatBtn" id="exportBronzeBtn">export as bronze</button>
      <button class="floatBtn" id="exportHtmlBtn">export as HTML</button>
      <button class="floatBtn" id="exportFileBtn">export bronze in files</button>
      <button class="floatBtn" id="runButton">run</button>
    </div>

    <script src="./../../fileManager.js"></script>
    <script type="module">
      // IMPORTING BRONZE COMPILER
      import { Bronze } from "./compiler.js";

      // IMPORTING EDITOR LIBRARY
      import { basicSetup } from "https://esm.sh/codemirror@6.0.2";

      import { EditorView } from "https://esm.sh/@codemirror/view@6";

      import { StreamLanguage } from "https://esm.sh/@codemirror/language@6";

      import { tags, Tag } from "https://esm.sh/@lezer/highlight@1";

      import {
        HighlightStyle,
        syntaxHighlighting,
      } from "https://esm.sh/@codemirror/language@6";

      import { closeBrackets } from "https://esm.sh/@codemirror/autocomplete@6";

      const logPlace = document.getElementById("errorLogs");

      function logError(message) {
        const errorElement = document.createElement("p");
        errorElement.innerText = message;
        logPlace.appendChild(errorElement);
      };

      const innerStyleTag = Tag.define();

      const editorStyle = HighlightStyle.define([
        { tag: tags.keyword, color: "#fcba03" },
        { tag: tags.string, color: "#f5dc98" },
        { tag: tags.meta, color: "#e8e002" },
        { tag: innerStyleTag, color: "#f760d2" },
      ]);

      const bronzeLanguage = StreamLanguage.define({
        tokenTable: {
          innerStyleTag,
        },
        token(stream, state) {
          if (stream.sol()) {
            if (stream.match("TEXT")) return "keyword";
            if (stream.match("LINE")) return "keyword";
            if (stream.match("BUTTON")) return "keyword";
            if (stream.match("HEADER")) return "keyword";
          }

          if (stream.match(/<<.*?>>/)) return "innerStyleTag";

          if (stream.match(/<<COLOR\s+\w+\s*>>/)) {
            return "meta";
          }

          if (stream.eatSpace()) return null;

          stream.next();
          return "string";
        },
      });

      const view = new EditorView({
        doc: "BODY(\nTEXT hello world\nLINE\nBUTTON click me\n)",
        extensions: [
          basicSetup,
          bronzeLanguage,
          syntaxHighlighting(editorStyle),
          closeBrackets(),
        ],
        parent: document.getElementById("editor"),
      });

      const compiler = new Bronze(logError);

      function executeBronze() {
        logPlace.innerHTML = "";
        const input = view.state.doc.toString();
        compiler.compileBronze(input);
        const output = compiler.readHtml();
        console.log(output);
        document.getElementById("outputFrame").srcdoc = output;
      }

      // blob help function
      function download(fileName, content, type = "text/plain") {
        const blob = new Blob([content], {type: type});
        const link = document.createElement("a");
  
        link.href = URL.createObjectURL(blob);
        link.download = fileName
        link.click()
      }

      // export functions
      function exportBronze() {
        let name = prompt("name of your file?");
        if(name.length < 1) {
          alert("your name must be at least one character!");
          return;
        }
        name = name + ".brz";
        const content = compiler.readBronze();
        download(name, content, "text/plain");
      }

      function exportHtml() {
        let name = prompt("name of your file?");
        if(name.length < 1) {
          alert("your name must be at least one character!");
          return;
        }
        name = name + ".html";
        const content = compiler.readHtml();
        download(name, content, "text/html");
      }

      function exportFile() {
        let name = prompt("name of your file?");
        if(name.length < 1) {
          alert("your name must be at least one character!");
          return;
        }
        name = name + ".brz";
        const content = compiler.readBronze();
        alert("your bronze file will be saved in the bronze folder, and othewise in root");
        cd("bronze");
        console.log(currentPath);
        writeFile(name, content);
        sendRefreshMessage();
      }

      // click listeners
      document.getElementById("runButton").addEventListener("click", executeBronze);
      document.getElementById("exportBronzeBtn").addEventListener("click", exportBronze);
      document.getElementById("exportHtmlBtn").addEventListener("click", exportHtml);
      document.getElementById("exportFileBtn").addEventListener("click", exportFile); 
    </script>
  </body>
</html>
