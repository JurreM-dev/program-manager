<!DOCTYPE html>
<html>
    <head></head>
    <body>

        <script type="module">
            import { Bronze } from './compiler.js';

            const compiler = new Bronze(console.log);
            compiler.compileBronze(`
BODY (
    TEXT hi!! <<ID hiText, CLASS redText, COLOR red>>
    LINE
    BUTTON click me! <<COLOR blue, BACKGROUNDCOLOR red, ROUNDING 20px>>
)`)
            const results = compiler.readHtml();
            document.body.innerHTML = results;
        </script>
    </body>
</html>
